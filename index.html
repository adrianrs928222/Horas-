<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Horas Trabajadas</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #222;
      color: white;
    }

    #resumen {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box" id="contenido">

  <h2>📊 Control de Horas</h2>

  <input type="date" id="fecha">

  <input type="time" id="entrada">

  <input type="time" id="salida">

  <input type="number" id="precio" placeholder="Precio por hora (€)">

  <button onclick="guardar()">Guardar</button>

  <hr>

  <input type="month" id="mes">

  <button onclick="verMes()">Calcular mes</button>

  <div id="resumen"></div>

  <table>
    <thead>
  <tr>
    <th>Día</th>
    <th>Fecha</th>
    <th>Horas</th>
    <th>Total</th>
  </tr>
</thead>

    <tbody id="tabla"></tbody>
  </table>

</div>

<script src="app.js"></script>

</body>
</html>
