<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Horas</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    td, th {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #222;
      color: white;
    }
  </style>
</head>
<body>

<div class="box">

  <h2>Horas trabajadas</h2>

  <input type="date" id="fecha">
  <input type="time" id="entrada">
  <input type="time" id="salida">
  <input type="number" id="precio" placeholder="€/hora">

  <button onclick="guardar()">Guardar</button>

  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Horas</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody id="tabla"></tbody>
  </table>

</div>

<script src="app.js"></script>

</body>
</html>
